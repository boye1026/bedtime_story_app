name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      
      - name: Setup Android project
        working-directory: mobile
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # 直接写入正确的 build.gradle
          cat > android/app/build.gradle << 'EOF'
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found.")
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}
def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: flutterRoot + '/packages/flutter_tools/gradle/flutter.gradle'
android {
    namespace 'com.bedtimestory.app'
    compileSdk 34
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    defaultConfig {
        applicationId "com.bedtimestory.app"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
flutter {
    source '../..'
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:"
}
EOF
          
          # 移除 AndroidManifest.xml 中的 uses-sdk
          sed -i '/<uses-sdk/d' android/app/src/main/AndroidManifest.xml
          
          echo "Build.gradle fixed"
          cat android/app/build.gradle | head -25
      
      - name: Install dependencies
        working-directory: mobile
        run: |
          flutter clean
          flutter pub get
      
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: bedtime-story-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
