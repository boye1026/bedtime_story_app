name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Setup Android project
        working-directory: mobile
        run: |
          # 清理并重新创建Android目录
          rm -rf android
          flutter create --platforms=android .
          
          # 修复AndroidManifest.xml
          sed -i 's/package=".*"/package="com.bedtimestory.app"/' android/app/src/main/AndroidManifest.xml
          
          # 添加namespace到build.gradle
          sed -i '/android {/a\    namespace "com.bedtimestory.app"' android/app/build.gradle
      
      - name: Build APK
        working-directory: mobile
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: bedtime-story-app
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
